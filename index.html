<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Binária Completa</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>🔢 Calculadora Binária</h1>
        <p>Digite quantos números binários quiser (separados por espaço, vírgula ou nova linha):</p>

        <textarea id="bin1" placeholder="Exemplo: 1010 111 10"></textarea>

        <label for="operacao">Escolha a operação:</label>
        <select id="operacao">
            <option value="soma">Soma</option>
            <option value="subtracaoSimples">Subtração simples</option>
            <option value="subtracaoComplemento2">Subtração (com complemento de dois)</option>
            <option value="multiplicacao">Multiplicação</option>
            <option value="divisao">Divisão (apenas 2 números)</option>
            <option value="complemento2">Complemento de dois</option>
        </select>

        <button id="btnCalcular">Calcular</button>

        <h2>🧩 Passo a passo:</h2>
        <pre id="passos"></pre>

        <h2>✅ Resultado:</h2>
        <pre id="resultado"></pre>
    </div>

    <script src="script.js"></script>
</body>

</html>
